name: Fix lab carousel

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-lab-carousel.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Replace cloned Swiper loop with bounded circular lab controller
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('main.js')
          s = p.read_text(encoding='utf-8')

          marker = '    function createSwipers() {'
          if marker not in s:
              raise SystemExit('createSwipers marker not found')

          fn = r'''    function createCircularLabCarousel() {
        const element = document.querySelector(".lab-swiper");
        if (!element) return;

        const wrapper = element.querySelector(".swiper-wrapper");
        const slides = wrapper ? [...wrapper.querySelectorAll(".lab-slide")] : [];
        const prev = element.querySelector(".lab-prev");
        const next = element.querySelector(".lab-next");
        const pagination = element.querySelector(".lab-pagination");

        if (!wrapper || slides.length < 2) return;

        let activeIndex = Math.min(1, slides.length - 1);
        let pointerStartX = null;
        let pointerCurrentX = null;

        element.classList.add("lab-circular-ready");
        element.style.overflow = "hidden";
        wrapper.style.position = "relative";
        wrapper.style.display = "block";
        wrapper.style.width = "100%";
        wrapper.style.height = "540px";
        wrapper.style.transform = "none";
        wrapper.style.transition = "none";

        const bullets = [];
        if (pagination) {
            pagination.innerHTML = "";
            slides.forEach((_, index) => {
                const bullet = document.createElement("button");
                bullet.type = "button";
                bullet.className = "swiper-pagination-bullet";
                bullet.setAttribute("aria-label", `Labormitglied ${index + 1} anzeigen`);
                bullet.addEventListener("click", () => {
                    activeIndex = index;
                    render();
                });
                pagination.appendChild(bullet);
                bullets.push(bullet);
            });
        }

        function circularOffset(index) {
            let offset = index - activeIndex;
            if (offset > slides.length / 2) offset -= slides.length;
            if (offset < -slides.length / 2) offset += slides.length;
            return offset;
        }

        function render() {
            const mobile = window.matchMedia("(max-width: 767px)").matches;
            const tablet = window.matchMedia("(max-width: 1100px)").matches;
            const nearX = mobile ? 0 : (tablet ? 260 : 360);
            const farX = mobile ? 0 : (tablet ? 470 : 650);

            slides.forEach((slide, index) => {
                const offset = circularOffset(index);
                const abs = Math.abs(offset);

                slide.style.position = "absolute";
                slide.style.top = "0";
                slide.style.left = "50%";
                slide.style.margin = "0";
                slide.style.transition = prefersReducedMotion
                    ? "none"
                    : "transform .48s cubic-bezier(.2,.8,.2,1), opacity .38s ease";
                slide.style.pointerEvents = offset === 0 ? "auto" : "none";
                slide.style.zIndex = offset === 0 ? "5" : abs === 1 ? "4" : "2";
                slide.setAttribute("aria-hidden", offset === 0 ? "false" : "true");

                if (mobile) {
                    slide.style.opacity = offset === 0 ? "1" : "0";
                    slide.style.transform = `translateX(-50%) scale(${offset === 0 ? 1 : .94})`;
                    return;
                }

                if (offset === 0) {
                    slide.style.opacity = "1";
                    slide.style.transform = "translateX(-50%) translateX(0) scale(1)";
                } else if (abs === 1) {
                    slide.style.opacity = ".62";
                    slide.style.transform = `translateX(-50%) translateX(${offset * nearX}px) scale(.86)`;
                } else if (abs === 2) {
                    slide.style.opacity = ".22";
                    slide.style.transform = `translateX(-50%) translateX(${offset * farX}px) scale(.72)`;
                } else {
                    slide.style.opacity = "0";
                    slide.style.transform = `translateX(-50%) translateX(${offset < 0 ? -farX : farX}px) scale(.68)`;
                }
            });

            bullets.forEach((bullet, index) => {
                const isActive = index === activeIndex;
                bullet.classList.toggle("swiper-pagination-bullet-active", isActive);
                bullet.setAttribute("aria-current", isActive ? "true" : "false");
            });
        }

        function go(delta) {
            activeIndex = positiveModulo(activeIndex + delta, slides.length);
            render();
        }

        if (prev) prev.addEventListener("click", () => go(-1));
        if (next) next.addEventListener("click", () => go(1));

        element.addEventListener("keydown", (event) => {
            if (event.key === "ArrowLeft") {
                event.preventDefault();
                go(-1);
            }
            if (event.key === "ArrowRight") {
                event.preventDefault();
                go(1);
            }
        });

        element.addEventListener("pointerdown", (event) => {
            if (event.target.closest("button")) return;
            pointerStartX = event.clientX;
            pointerCurrentX = event.clientX;
            if (typeof element.setPointerCapture === "function") {
                element.setPointerCapture(event.pointerId);
            }
        });

        element.addEventListener("pointermove", (event) => {
            if (pointerStartX === null) return;
            pointerCurrentX = event.clientX;
        });

        element.addEventListener("pointerup", (event) => {
            if (pointerStartX === null) return;
            const endX = pointerCurrentX ?? event.clientX;
            const delta = endX - pointerStartX;
            pointerStartX = null;
            pointerCurrentX = null;
            if (Math.abs(delta) < 46) return;
            go(delta < 0 ? 1 : -1);
        });

        element.addEventListener("pointercancel", () => {
            pointerStartX = null;
            pointerCurrentX = null;
        });

        window.addEventListener("resize", render, { passive: true });
        render();
    }

'''

          s = s.replace(marker, fn + marker, 1)

          old = '''        createSeamlessSwiper(".lab-swiper", {
            initialSlide: 1,
            loop: true,
            autoplay: false
        });'''
          new = '        createCircularLabCarousel();'
          if old not in s:
              raise SystemExit('lab loop call not found')
          s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Syntax check
        run: node --check main.js
      - name: Commit repair
        run: |
          git config user.name "hapo3005"
          git config user.email "jan.nikolic@web.de"
          git add main.js
          git commit -m "Repair lab carousel with bounded circular layout"
          git push
